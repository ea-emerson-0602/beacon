# Blueprint for the Beacon API. Connect this repo in Render and it will
# create a Node web service rooted at backend/.
# Database is Aiven Postgres — paste the Service URI into DATABASE_URL and
# DIRECT_URL in the Dashboard (see SETUP.md).
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: beacon-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Free web services have no Pre-Deploy field. Migrate in start instead.
    startCommand: npm run prisma:migrate && npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: REDIS_URL
        value: ""
